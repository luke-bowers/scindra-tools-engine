name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest
        env:
          PYTHONPATH: src

      - name: Generate schemas
        run: uv run python scripts/generate_schemas.py

      - name: Check schema drift
        run: uv run python scripts/check_schemas_up_to_date.py

      - name: Verify package version matches tag
        run: uv run python scripts/check_release_version.py ${{ github.ref_name }}

      - name: Build
        run: uv run python -m build

      - name: Twine check
        run: uv run twine check dist/*

      - name: Generate constraints-desktop.txt
        run: |
          WHEEL=$(ls dist/scindra_engine-*.whl)
          uv run python scripts/generate_constraints_desktop.py --wheel "$WHEEL" --out constraints-desktop.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC when no username/password are set. Configure Trusted Publishing
        # on PyPI: project → Publishing → Add trusted publisher (GitHub Actions,
        # this repo, workflow release.yml). Fallback: set PYPI_API_TOKEN secret
        # and pass it as password with username __token__.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            constraints-desktop.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
